services:
  postgres:
    image: postgres:17-alpine
    container_name: carepoint-postgres
    restart: unless-stopped
    env_file:
      - ./back/.env
    ports:
      - "5432:5432"
    volumes:
      - carepoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepoint -d carepoint"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  carepoint-postgres-data:
